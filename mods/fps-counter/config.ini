; FPS Counter - Project Lazarus
; Changes take effect the next time the game starts.

[overlay]
; small box over the game showing the frame rate. Not visible in exclusive fullscreen
; (borderless and windowed work). true/false
enabled = true
; top-left, top-right, bottom-left, bottom-right
corner = top-left

[title]
; also show the frame rate in the window title. true/false
enabled = false

[log]
; write the average frame rate to lazarus.log every N seconds. 0 = off
interval_seconds = 10
