name: build

on:
  push:
  pull_request:

jobs:
  windows:
    # pinned so a runner image bump can't silently change the toolchain
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (unit, installer, end-to-end bootstrap)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: project-lazarus-dist
          path: build/dist/
